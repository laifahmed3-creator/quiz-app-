<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Quiz App</title>
    <link rel="stylesheet" href="STYLE.CSS">
</head>

<body>
    <main class="app">

        <header class="quiz-header">

            <h1>🧠 Simple Quiz App</h1>

            <p class="subtitle">
                Test your HTML, CSS & JavaScript knowledge
            </p>

        </header>

        <div class="quiz-info">

            <span id="progress">
                Question 1 of 8
            </span>

            <span id="score">
                Score: 0
            </span>

        </div>

        <div class="progress-container">

            <div id="progress-bar"></div>

        </div>

        <section class="quiz">

            <h2 id="question" aria-live="polite">
                Question goes here
            </h2>

            <div id="answer-buttons">

                <button class="btn"></button>

                <button class="btn"></button>

                <button class="btn"></button>

                <button class="btn"></button>

            </div>

            <button id="next-btn">
                Next →
            </button>

        </section>

        <footer class="footer">

            <p>
                Made by <strong>LAIF AHMED</strong> ❤️ using HTML, CSS & JavaScript
            </p>

        </footer>

    </main>

    <script src="SCRIPT.JS"></script>

</body>

</html>
